[agent]
instance_name = lab-pg18
interval_seconds = 60
store_query_text = false

[source]
# Keep passwords out of this file. systemd sets PGPASSFILE=/etc/pgintel/pgpass.
dsn = host=127.0.0.1 port=5432 dbname=postgres user=pgintel connect_timeout=5 application_name=pgintel-agent

[repository]
# Repository can be another PostgreSQL instance/database.
# Password also belongs in /etc/pgintel/pgpass.
dsn = host=127.0.0.1 port=5432 dbname=pgintel user=pgintel_repo connect_timeout=5 application_name=pgintel-agent

[analysis]
query_regression_ratio = 3.0
query_regression_min_ms = 50.0
query_regression_min_calls = 5
dead_tuple_ratio = 0.20
temp_bytes_alert = 1073741824
large_unused_index_bytes = 1073741824
